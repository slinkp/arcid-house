<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>aRCid house</title>
</head>

<body>
  <div id="start-screen">
    <p class="start-banner"><span class="manual-em">aRCid house</span> — PRESS 1P START</p>

    <div id="controls">
      <!-- Temporary: pixel/font diagnostics for RCade CRT tuning -->
      <div id="pixel-diagnostics" aria-hidden="true">
        <p class="diag-title manual-em">-- PIXEL DIAG --</p>

        <div class="diag-frame">
          <span class="diag-corner diag-corner-tl" aria-hidden="true"></span>
          <span class="diag-corner diag-corner-tr" aria-hidden="true"></span>
          <span class="diag-corner diag-corner-bl" aria-hidden="true"></span>
          <span class="diag-corner diag-corner-br" aria-hidden="true"></span>

          <div class="diag-row">
            <div class="diag-item">
              <span class="diag-label">G8</span>
              <div class="diag-grid-8" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">H1</span>
              <div class="diag-stripe diag-stripe-h1" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">V1</span>
              <div class="diag-stripe diag-stripe-v1" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">H2</span>
              <div class="diag-stripe diag-stripe-h2" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">V2</span>
              <div class="diag-stripe diag-stripe-v2" aria-hidden="true"></div>
            </div>
          </div>

          <div class="diag-row">
            <div class="diag-item">
              <span class="diag-label">FIL</span>
              <div class="diag-block-fill" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">BOX</span>
              <div class="diag-block-border" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">X0</span>
              <div class="diag-offset diag-offset-0" aria-hidden="true"></div>
            </div>
            <div class="diag-item">
              <span class="diag-label">X1</span>
              <div class="diag-offset diag-offset-1" aria-hidden="true"></div>
            </div>
            <div id="diag-test-box" class="diag-test-box" aria-hidden="true"></div>
          </div>

          <div class="diag-font-ladder">
            <p><span class="diag-label">8-</span>HHii@@||</p>
            <p class="diag-filter"><span class="diag-label">8+</span>HHii@@||</p>
            <p class="diag-fs16"><span class="diag-label">16-</span>HHii<span class="diag-filter"><span class="diag-label"> +</span>HHii</span></p>
          </div>

          <div class="diag-row">
            <div class="diag-item">
              <span class="diag-label">DOM</span>
              <span class="diag-dom-text">HHii</span>
            </div>
            <div class="diag-item">
              <span class="diag-label">CVS</span>
              <canvas id="diag-canvas" width="32" height="8"></canvas>
            </div>
            <div class="diag-item">
              <span class="diag-label">PX</span>
              <canvas id="diag-canvas-pixels" width="16" height="8"></canvas>
            </div>
          </div>

          <div class="diag-row diag-swatches">
            <span class="diag-label">CLR</span>
            <span class="diag-swatch diag-swatch-eee" title="#eee"></span>
            <span class="diag-swatch diag-swatch-fff" title="#fff"></span>
            <span class="diag-swatch diag-swatch-cyan" title="#00e5ff"></span>
            <span class="diag-swatch diag-swatch-red" title="#ff2b2b"></span>
            <span class="diag-swatch diag-swatch-green" title="#0f0"></span>
          </div>
        </div>

        <ul id="resolution-debug"></ul>
      </div>
    </div>
  </div>

  <div id="running-app" class="hidden">

    <div id="global">
      <button id="play-pause" class="widget" tabindex="-1"
              data-area="global"
              data-row="0"
              data-col="0"
              >
        &gt;
      </button>
      <span id="bpm-label"
            data-area="global"
            data-row="0"
            data-col="1">BPM:</span>

      <span id="bpm" class="widget" tabindex="-1"
            data-area="global"
            data-row="0"
            data-col="2">
        120.0
      </span>
      <div id="debug">Debug: <span>x:0 y:1 step: </span></div>
      <div id="error"></div>
    </div>

    <div id="bass">
      <div class="area-title">BASS</div>
      <div id="bass-steps">
        <!-- insert programatically -->
      </div>
      <div class="area-subtitle">Pitch (spinner controls selected step)</div>
      <div id="bass-pitches">
        <!-- insert programatically -->
      </div>

    </div>

    <div id="drums">
      <div class="area-title">DRUMS</div>
      <!-- drum rows & cols inserted programatically -->
    </div>

  </div>
  <script type="module" src="/src/main.js"></script>
</body>
